name: swarm

# Manual trigger for the AI agent swarm (docker/swarm.sh).  Builds the image with
# the Claude Code CLI (WITH_CLAUDE=1) and runs a swarm task non-interactively.
# The swarm opens a DRAFT PR; a human reviews and merges.  Needs a credential
# secret (CLAUDE_CODE_OAUTH_TOKEN preferred, or ANTHROPIC_API_KEY).

on:
  workflow_dispatch:
    inputs:
      task:
        description: swarm task file
        default: docker/swarm-task.md
      model:
        description: model override (optional)
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  swarm:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Require a credential secret
        run: |
          if [ -z "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}" ] && [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "no CLAUDE_CODE_OAUTH_TOKEN / ANTHROPIC_API_KEY secret set"; exit 1; fi
      - name: Build image with the Claude Code CLI
        run: docker build --target tools --build-arg WITH_CLAUDE=1 -t dv-tools-claude .
      - name: Run the swarm
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm -v "$PWD":/repo -w /repo \
            -e CLAUDE_CODE_OAUTH_TOKEN -e ANTHROPIC_API_KEY -e GITHUB_TOKEN \
            dv-tools-claude /repo/docker/swarm.sh --task "${{ inputs.task }}" ${{ inputs.model && format('--model {0}', inputs.model) || '' }}
      - uses: actions/upload-artifact@v4
        with: { name: swarm-metrics, path: docker/last-run-metrics.json, if-no-files-found: ignore }
